name: Tokentiva CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tokentiva_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tokentiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tokentiva_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: test-only-very-long-better-auth-secret-not-for-production
      TOKENTIVA_SIGNUP_ENABLED: "false"
      NEXT_PUBLIC_TOKENTIVA_SIGNUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Migrate Better Auth schema (including TOTP)
        run: npx --yes auth@1.7.25 migrate --yes
      - name: Migrate domain and invitations
        run: npm run db:domain:migrate
      - name: Create restricted application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tokentiva_test -v ON_ERROR_STOP=1 -v app_password=ci-test-only-password -f scripts/provision-runtime-role.sql
      - name: Bootstrap owner invite rehearsal (admin only, hide one-time token)
        env:
          TOKENTIVA_BOOTSTRAP_EMAIL: bootstrap-ci@example.org
          TOKENTIVA_BOOTSTRAP_ORG: Tokentiva Staging CI
        run: |
          node scripts/bootstrap-owner.mjs > /tmp/tokentiva-bootstrap.txt
          grep -q TOKENTIVA_BOOTSTRAP_CREATED /tmp/tokentiva-bootstrap.txt
          ! node scripts/bootstrap-owner.mjs > /dev/null 2>&1
          rm -f /tmp/tokentiva-bootstrap.txt
      - name: Authorization + invitation tests (non-superuser with RLS)
        env:
          DATABASE_URL: postgresql://tokentiva_app:ci-test-only-password@localhost:5432/tokentiva_test
        run: npm test
      - name: PostgreSQL backup and isolated restore drill
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump -h localhost -U postgres -d tokentiva_test -Fc -f /tmp/tokentiva-ci.dump
          createdb -h localhost -U postgres tokentiva_restore_test
          pg_restore -h localhost -U postgres -d tokentiva_restore_test --no-owner --no-acl /tmp/tokentiva-ci.dump
          psql -h localhost -U postgres -d tokentiva_restore_test -Atqc "SELECT (relrowsecurity AND relforcerowsecurity)::text FROM pg_class WHERE relname='assets';" | grep -qx t
          psql -h localhost -U postgres -d tokentiva_restore_test -Atqc "SELECT (relrowsecurity AND relforcerowsecurity)::text FROM pg_class WHERE relname='asset_documents';" | grep -qx t
          psql -h localhost -U postgres -d tokentiva_restore_test -Atqc "SELECT count(*) FROM organization_invitations WHERE role='owner';" | grep -qx 1
          rm -f /tmp/tokentiva-ci.dump
      - name: Verify Docker Compose configuration
        run: docker compose --env-file deploy/.env.staging.example -f deploy/staging.compose.yml config --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build staging application container
        run: docker build --target runner --tag tokentiva:ci .
