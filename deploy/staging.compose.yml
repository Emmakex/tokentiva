name: tokentiva-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokentiva_admin
      POSTGRES_PASSWORD: ${TOKENTIVA_DB_ADMIN_PASSWORD:?Set_TOKENTIVA_DB_ADMIN_PASSWORD}
      POSTGRES_DB: tokentiva
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokentiva_admin -d tokentiva"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - private
      - updates
    # La imagen oficial incluye healthcheck de clamd. NO publicar 3310.
    healthcheck:
      start_period: 4m
      interval: 30s
      timeout: 15s
      retries: 5
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tokentiva_app:${TOKENTIVA_DB_APP_PASSWORD:?Set_TOKENTIVA_DB_APP_PASSWORD}@postgres:5432/tokentiva
      BETTER_AUTH_URL: https://${TOKENTIVA_STAGING_DOMAIN:?Set_TOKENTIVA_STAGING_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set_BETTER_AUTH_SECRET}
      TOKENTIVA_SIGNUP_ENABLED: "false"
      NEXT_PUBLIC_TOKENTIVA_SIGNUP_ENABLED: "false"
      TOKENTIVA_SMTP_HOST: ${TOKENTIVA_SMTP_HOST:?Set_TOKENTIVA_SMTP_HOST}
      TOKENTIVA_SMTP_PORT: ${TOKENTIVA_SMTP_PORT:-465}
      TOKENTIVA_SMTP_USER: ${TOKENTIVA_SMTP_USER:?Set_TOKENTIVA_SMTP_USER}
      TOKENTIVA_SMTP_PASSWORD: ${TOKENTIVA_SMTP_PASSWORD:?Set_TOKENTIVA_SMTP_PASSWORD}
      TOKENTIVA_SMTP_FROM: ${TOKENTIVA_SMTP_FROM:?Set_TOKENTIVA_SMTP_FROM}
      TOKENTIVA_DOCUMENT_UPLOADS_ENABLED: ${TOKENTIVA_DOCUMENT_UPLOADS_ENABLED:-false}
      TOKENTIVA_DOCS_KEY_B64: ${TOKENTIVA_DOCS_KEY_B64:?Set_TOKENTIVA_DOCS_KEY_B64}
      TOKENTIVA_CLAMD_HOST: clamav
      TOKENTIVA_CLAMD_PORT: "3310"
    expose:
      - "3000"
    networks:
      - private
      - public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TOKENTIVA_STAGING_DOMAIN: ${TOKENTIVA_STAGING_DOMAIN:?Set_TOKENTIVA_STAGING_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - public
    security_opt:
      - no-new-privileges:true

  migrator:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tokentiva_admin:${TOKENTIVA_DB_ADMIN_PASSWORD:?Set_TOKENTIVA_DB_ADMIN_PASSWORD}@postgres:5432/tokentiva
      BETTER_AUTH_URL: https://${TOKENTIVA_STAGING_DOMAIN:?Set_TOKENTIVA_STAGING_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set_BETTER_AUTH_SECRET}
      TOKENTIVA_DB_APP_PASSWORD: ${TOKENTIVA_DB_APP_PASSWORD:?Set_TOKENTIVA_DB_APP_PASSWORD}
      TOKENTIVA_SIGNUP_ENABLED: "false"
    networks:
      - private
    restart: "no"
    security_opt:
      - no-new-privileges:true

networks:
  public: {}
  private:
    internal: true
  updates: {}

volumes:
  postgres_data:
  clamav_db:
  caddy_data:
  caddy_config:
